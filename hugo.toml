baseURL = "https://www.mildlyjournaling.com/"
locale = 'en-us'
title = 'Mildly Journaling'
theme = 'paper'
capitalizeListTitles = false
publishDir = 'build'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'assets/post-images'

[params]
  rss = true
  commentsEnabled = true
  buttondownUsername = "mildlyjournaling"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "apps"
    name = "Apps"
    url = "/apps/"
    weight = 15
  [[menu.main]]
    identifier = "activity"
    name = "Activity"
    url = "/activity/"
    weight = 20

[outputs]
  home = ['html', 'comments']
  section = ['html', 'rss', 'json']
  taxonomy = ['html']
  term = ['html']

[outputFormats.comments]
  mediaType = 'application/json'
  baseName = 'comments-posts'
  isPlainText = true
  notAlternative = true
