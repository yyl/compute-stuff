name: Sync Latest Activity

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

concurrency:
  group: sync-latest-activity
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the latest currently reading book
        env:
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
        run: node scripts/fetch-hardcover.js

      - name: Fetch the latest archived article
        if: ${{ !cancelled() }}
        env:
          READWISE_ACCESS_TOKEN: ${{ secrets.READWISE_ACCESS_TOKEN }}
        run: python3 scripts/fetch-latest-activity.py readwise

      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity/currently_reading.yaml data/activity/latest_article.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync latest activity"
            git push || (git pull --rebase && git push)
          fi
